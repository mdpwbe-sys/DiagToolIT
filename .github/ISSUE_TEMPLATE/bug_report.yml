name: 🐛 Signalement de Bug
description: Signaler une anomalie, une erreur de script ou un dysfonctionnement d'affichage.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler une anomalie pour améliorer DiagToolIT !
  - type: input
    id: environment
    attributes:
      label: Environnement Windows
      description: Précisez votre version de Windows et PowerShell (ex: Windows 11 23H2, PowerShell 5.1).
      placeholder: Windows 11 Pro 64-bit / PowerShell 5.1
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description du Bug
      description: Explication claire et concise de l'anomalie rencontrée.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Étapes pour Reproduire
      description: Comment reproduire le problème ?
      placeholder: |
        1. Lancer 'Lancer Diagnostic IT UAA3.bat'
        2. Ouvrir l'onglet 'Audit Réseau'
        3. Constater l'erreur ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement Attendu
      description: Quel résultat auriez-vous dû obtenir ?
